name: visual_novel_observatory
description: A mobile client for VNDB.org built with Flutter.
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  dio: ^5.9.2
  google_fonts: ^8.1.0
  flutter_riverpod: ^3.3.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  hive_ce: ^2.19.3
  hive_ce_flutter: ^2.3.4
  share_plus: ^13.1.0
  flex_color_scheme: ^8.4.0
  go_router: ^17.3.0
  font_awesome_flutter: ^11.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icon/observatory_android.png"
  image_path_ios: "assets/icon/observatory_ios.png"
  adaptive_icon_background: "#161c2e"
  adaptive_icon_foreground: "assets/icon/observatory_android.png"

flutter_native_splash:
  color: "#161c2e"
  image: assets/icon/observatory_ios.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#161c2e"
    image: assets/icon/observatory_android.png

flutter:
  uses-material-design: true
