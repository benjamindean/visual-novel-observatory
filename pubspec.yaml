name: visual_novel_observatory
description: A mobile client for VNDB.org built with Flutter.
version: 1.0.3

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.1
  http: ^1.6.0
  dio: ^5.11.1
  google_fonts: ^9.0.0
  flutter_riverpod: ^3.5.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  url_launcher: ^6.3.3
  cached_network_image: ^4.0.7
  palette_generator_master: ^1.2.0
  photo_view: ^0.15.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  share_plus: ^13.3.1
  flex_color_scheme: ^9.0.0
  go_router: ^18.1.4
  font_awesome_flutter: ^11.0.0
  flutter_secure_storage: ^11.2.0
  flutter_localized_locales: ^2.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.17.1
  freezed: ^4.0.3
  json_serializable: ^6.15.2
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path_android: "assets/icon/observatory_android.png"
  image_path_ios: "assets/icon/observatory_ios.png"
  adaptive_icon_background: "#161c2e"
  adaptive_icon_foreground: "assets/icon/observatory_android.png"

flutter_native_splash:
  color: "#161c2e"
  image: assets/icon/observatory_android.png
  android: true
  ios: true
  fullscreen: true
  android_12:
    color: "#161c2e"
    image: assets/icon/observatory_android.png

flutter:
  uses-material-design: true
