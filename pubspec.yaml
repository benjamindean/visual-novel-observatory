name: visual_novel_observatory
description: A premium mobile client for VNDB.org built with Flutter.
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.6.0
  google_fonts: ^8.1.0
  flutter_riverpod: ^3.3.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  url_launcher: ^6.3.2
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  sqflite_common_ffi: ^2.4.1
  shared_preferences: ^2.5.5


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.14.0

flutter:
  uses-material-design: true
